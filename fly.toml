app = "job-app"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/job-app.db"
  SCAN_CRON = "0 6 * * *"

[[mounts]]
  source = "job_app_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
